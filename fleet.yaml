# Hermes Fleet — 상위 폴더(root) 아래 저장소들을 순회하는 하네스 설정
root: /home/ubuntu

# 작동 시간대. 이 시간 밖에서는 새 작업을 시작하지 않고(cron 실행이면 종료) 진행 중인 티켓만 마친다.
active_hours: "01:00-08:00"
# 시간대 종료 N분 전부터는 새 티켓/발굴을 시작하지 않는다 (진행 중 작업이 08:00을 넘기지 않도록).
no_new_work_minutes_before_end: 45
# 하루 한 번 자동 머지 시각 (QA PASS 브랜치 → 기준 브랜치, 검증 후 push). 비우면 안 함.
merge_at: "07:30"
poll_seconds: 600
endpoint_retry_seconds: 60

# 작업 대상: root 아래 git 저장소 중 프런트엔드(FE)와 백엔드(BE)가 모두 분명한 레포만 자동 선정.
# include 가 비어 있지 않으면 그 목록 안에서만 고른다. exclude 는 항상 제외.
include: []
exclude:
  - hermes-fleet
  - docker-class
  - rfp-crawler
  - msa-k8s-lab      # 서비스 여러 개(MSA 실습), 원격 없음, 소유자 불일치(dubious ownership) → 수동 포함 전까지 제외

# 레포별 오버라이드 (디렉터리 자동 탐지가 틀릴 때)
repos:
  webrtc-app:
    frontend: frontend
    backend: signaling

discover:
  max_proposals: 2        # 레포당 한 번 발굴에 제안할 최대 티켓 수
  max_open_proposed: 4    # 레포에 승인 대기(proposed) 티켓이 이 수 이상이면 그 레포 발굴은 쉰다

auto_merge:
  verify: true
  require_verification: true   # 실행 가능한 검증 단계(테스트/빌드)가 하나도 없는 레포는 자동 머지하지 않는다
  verify_timeout: 900
  push: true
  delete_merged_branches: true
