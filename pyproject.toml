[project]
name = "hermes-fleet"
version = "0.1.0"
description = "여러 저장소를 순회하며 FE/BE가 분명한 레포만 Hermes(CrewAI) 가상 조직으로 고도화하는 상위 폴더 하네스"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai>=1.0,<2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
monitor = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
hermes-fleet = "hermes_fleet.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hermes_fleet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
