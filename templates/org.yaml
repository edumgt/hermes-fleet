# Hermes Fleet 기본 조직 정의 (모든 레포에 공통 적용).
# 레포에 hermes/config/org.yaml 이 있으면 그 파일이 우선한다.
# project 섹션은 레포 프로필에서 실행 시점에 채워진다.
project:
  name: (repo)
  description: (auto)
  conventions:
    - 코드 변경은 반드시 저장소 안의 기존 스타일(들여쓰기, 세미콜론, 모듈 방식, 네이밍)을 따른다.
    - 의존성 추가는 최소화하고, 추가 시 매니페스트(package.json/requirements.txt/pom.xml)와 lock 파일을 함께 갱신한다.
    - 새 동작에는 테스트를 추가한다. 저장소 프로필에 적힌 테스트 명령으로 실행 가능해야 한다.
    - 사용자에게 보이는 문구는 한국어, 코드 식별자/로그는 영어.
    - 모든 날짜·시간 데이터는 한국 시간(Asia/Seoul, KST, UTC+9) 기준이다 — 백엔드·배치·DB·프런트엔드 전부.
      서버/배치 프로세스와 컨테이너는 TZ=Asia/Seoul 로 고정하고(코드에서도 기본 시간대를 KST 로 설정), DB 컬럼은 timezone 포함 타입(timestamptz 등)에 KST 로 저장하거나
      naive 컬럼이면 반드시 KST 값만 넣는다(UTC 혼용 금지). API 응답의 시각은 ISO 8601 에 +09:00 오프셋을 명시하고, 날짜만 쓰는 값(YYYY-MM-DD)도 KST 달력일이다.
      외부(GitHub, AWS, 거래소 등)에서 받은 UTC 값은 저장·표시 전에 KST 로 변환한다. 테스트는 TZ 를 KST 로 고정한 상태에서 돈다.
    - .env, .git, node_modules, 빌드 산출물(dist/target)은 절대 수정하지 않는다.
    - 프런트엔드 작업은 아래 frontend_guide(오프캔버스 좌측 햄버거 메뉴 셸 · 표 AG Grid Community · 차트 ApexCharts/TradingView · Tailwind CSS · Pretendard · FHD 1920×1080 한 화면 구성 · 중요 입출력은 모달 팝업)를 따른다.

# 프런트엔드 기술 가이드 — 디자이너·개발자·QA·Tech Lead 프롬프트에 그대로 주입된다 (모든 레포 공통).
# 레포별로 바꾸려면 <repo>/hermes/config/org.yaml 에 frontend_guide 를 다시 정의한다 (없으면 이 템플릿 것을 상속, `frontend_guide: false` 면 끈다).
frontend_guide:
  title: 프런트엔드 기술 가이드 (모든 레포 공통 — 반드시 따른다)
  stack:
    - area: CSS
      use: Tailwind CSS
      rule: >
        새 화면·컴포넌트의 스타일은 Tailwind 유틸리티 클래스로 쓴다. 별도 CSS 파일/인라인 style 은 Tailwind 로 표현할 수 없을 때만 최소한으로.
        기존 CSS 변수(색·간격·반경)는 tailwind 설정(theme.extend) 또는 @theme 으로 매핑해 재사용하고 색상 값을 새로 발명하지 않는다.
      npm: "tailwindcss@4 (+ @tailwindcss/vite 또는 @tailwindcss/postcss)"
      cdn: "<script src=\"https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.5\"></script>  (정적 HTML 레포 전용 Play CDN)"
    - area: 폰트
      use: Pretendard
      rule: >
        본문·UI 글꼴은 Pretendard Variable. font-family 는 "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, "Helvetica Neue", "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif 순.
        Tailwind 를 쓰면 fontFamily.sans(또는 --font-sans)를 이 값으로 둔다. 코드/로그 영역만 모노스페이스 허용. 다른 웹폰트(Noto Sans 웹폰트 로드 등)는 추가하지 않는다.
      cdn: "<link rel=\"stylesheet\" href=\"https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css\">"
      npm: "pretendard@1.3.9"
    - area: 표
      use: AG Grid Community
      rule: >
        정렬·필터·페이지네이션·대량 행이 필요한 데이터 표는 AG Grid Community(ag-grid-community, MIT)로 만든다.
        Enterprise 전용 기능(행 그룹핑/피벗/사이드바/Excel export/ag-grid-enterprise 패키지)은 쓰지 않는다. Theming API(themeQuartz, 다크 모드는 colorSchemeDark)를 쓰고 레거시 CSS 테마 파일은 넣지 않는다.
        상호작용 없는 5행 이하의 작은 표는 일반 <table>(Tailwind 클래스) 허용. 다른 그리드 라이브러리(DataTables, Tabulator, Handsontable 등)는 추가하지 않는다.
      npm: "ag-grid-community@34.2.0"
      cdn: "<script src=\"https://cdn.jsdelivr.net/npm/ag-grid-community@34.2.0/dist/ag-grid-community.min.js\"></script>"
    - area: 레이아웃·내비게이션
      use: 오프캔버스(offcanvas) 좌측 LNB + 상단 바 사이드바 트리거 (참조 구현 hermes-fleet 모니터 hermes_fleet/monitor/static/index.html)
      rule: >
        모든 화면은 공통 셸(shell) 안에 둔다. 상단 바 왼쪽 첫 자리에 항상 사이드바 트리거 버튼이 있다(데스크톱은 패널 아이콘, 모바일은 햄버거 ☰; aria-controls/aria-expanded, Ctrl/⌘+B 와 Alt+M 단축키).
        좌측 오프캔버스 사이드바(LNB)가 유일한 1차 메뉴다 — 상단 탭·하단 탭·화면마다 다른 내비게이션을 만들지 않는다.
        데스크톱(≥1024px)은 push 모드로 두 상태를 오간다: 펼침(248px, 아이콘+라벨+카운트 배지) ↔ 아이콘 레일(68px, 아이콘만 + hover/focus 툴팁, 활성 표시 막대, 배지는 점으로 축약). 상태는 localStorage 에 기억한다.
        모바일(<1024px)은 본문 위로 겹치는 시트(overlay) 모드: 배경 dim, 바깥 클릭·Esc·닫기 버튼으로 닫힘, 열릴 때 활성 항목으로 포커스 이동, 포커스 트랩, 메뉴 선택 시 자동 닫힘.
        사이드바 구성: 상단 로고 마크 + 서비스명(레일에서는 마크만, 마크 클릭 = 펼치기) → 섹션 라벨 + 메뉴 항목(stroke 1.75 의 선형 SVG 아이콘 18px + 라벨, 현재 화면 aria-current="page" 와 좌측 3px 액센트 막대·연한 액센트 배경, 필요한 항목엔 카운트 배지·라이브 점)
        → 하단 상태 영역(서비스 상태 점, 테마 토글: 시스템→라이트→다크 를 data-theme 와 localStorage 로, 설정 버튼, 사용자 아바타 원형 이니셜, 레일로 접기 버튼).
        전체 하단에는 고정 푸터를 둔다: 높이 10px, 배경 #000, 흰색 대문자 'EDUMGT'(8px, letter-spacing .22em) 가운데 정렬, 모든 화면·모바일·두 테마에서 동일하며 본문과 사이드바는 푸터 위(bottom: 10px)에서 끝나 겹치지 않는다.
        트랜지션은 transform/width 200ms ease-out 이고 prefers-reduced-motion 이면 끈다. 라우팅이 없는 정적 HTML 이라도 모든 페이지가 같은 사이드바 마크업을 포함해 메뉴가 항상 같은 자리에 있어야 한다.
        구현은 Tailwind 유틸리티로 하고 상태는 <body data-lnb="open|rail|sheet|closed"> 하나로 표현해 group-data 변형으로 그린다(의사 요소 툴팁·활성 막대만 CSS). 별도 UI 프레임워크(Bootstrap offcanvas 등)는 추가하지 않는다.
    - area: 차트
      use: ApexCharts 또는 TradingView Lightweight Charts
      rule: >
        일반 차트(막대·선·영역·도넛·히트맵·레이더 등)는 ApexCharts. 시계열 금융 차트(캔들스틱·OHLC·거래량·실시간 틱 스트리밍)는 TradingView Lightweight Charts(Apache-2.0).
        Chart.js, Highcharts, ECharts, D3 로 직접 그리기 등 다른 차트 라이브러리는 추가하지 않는다. 이중 y축 금지, 시리즈가 2개 이상이면 범례 필수, 상태 색(성공/경고/오류)은 범주 색과 섞어 쓰지 않는다.
      npm: "apexcharts@4.7.0 · lightweight-charts@5.2.1"
      cdn: "<script src=\"https://cdn.jsdelivr.net/npm/apexcharts@4.7.0/dist/apexcharts.min.js\"></script> · <script src=\"https://cdn.jsdelivr.net/npm/lightweight-charts@5.2.1/dist/lightweight-charts.standalone.production.js\"></script>"
    - area: 테마
      use: 라이트/다크 모드 선택 (시스템 → 라이트 → 다크)
      rule: >
        모든 색은 CSS 토큰으로만 정의한다: ':root' 에 라이트 전체 팔레트, '@media (prefers-color-scheme: dark)' 안의 ':root:not([data-theme="light"])' 와 ':root[data-theme="dark"]' 두 블록에 같은 다크 값(+ color-scheme: dark).
        컴포넌트 규칙에 리터럴 색을 쓰지 않고(한 테마에서만 보이는 색 금지), 상태색·범주색도 테마별 값을 둔다. 사이드바 하단에 테마 토글(시스템→라이트→다크, data-theme 과 localStorage 에 저장)을 두고
        AG Grid(themeQuartz + colorSchemeDark)·ApexCharts(theme.mode)·캔버스/3D 도 토글 즉시 다시 그린다. 두 테마 모두 본문 텍스트 대비 4.5:1 이상, 경계선·그리드선·호버 배경이 각각 보여야 하며 다크는 라이트의 단순 반전이 아니라 별도 선택한 값이다.
    - area: 날짜·시간 표시
      use: 한국 시간(Asia/Seoul) 고정 표기
      rule: >
        화면의 모든 시각은 Intl.DateTimeFormat 또는 toLocale* 에 timeZone "Asia/Seoul", hour12 false 옵션을 주어 KST 로 표시하고 브라우저 로컬 시간대에 의존하지 않는다(해외·UTC 브라우저에서도 같은 값).
        오프셋 없는 문자열(YYYY-MM-DD HH:mm:ss)은 KST 로 해석해 +09:00 을 붙여 파싱하고, Z/오프셋이 있는 값은 KST 로 변환한다. 차트 시간축(ApexCharts datetime, Lightweight Charts)도 KST 로 라벨링한다.
        포맷은 YYYY-MM-DD HH:mm(:ss) 24시간제, 상대 시각("3분 전")은 서버 시각 기준 skew 를 보정해 계산하며, 시계·헤더에는 "KST" 를 표기한다.
    - area: 화면 규격
      use: FHD(1920×1080) 기준 · 한 화면 구성
      rule: >
        기준 뷰포트는 FHD 1920×1080(브라우저 UI 를 뺀 가용 높이 약 940px)이다. 주요 화면(대시보드·목록·상세·설정)은 이 뷰포트에서
        브라우저 세로 스크롤바가 생기지 않도록(document.scrollHeight ≤ window.innerHeight) 한 화면에 들어오게 구성하고, 가로 스크롤은 어떤 해상도에서도 금지한다.
        긴 목록·로그·표는 페이지를 늘리지 말고 카드/패널 내부 영역(AG Grid 의 자체 스크롤, overflow:auto, 높이는 flex/vh 로 뷰포트에 맞춤)에서 스크롤한다.
        콘텐츠 폭은 1920 을 기준으로 설계하되 1366~1920 에서 레이아웃이 유지되어야 하며(열 수를 줄이는 반응형), 1920 보다 넓은 화면에서는 가운데 정렬 또는 최대 폭으로 묶는다.
        보조 정보(설정값 나열, 통계 카드)는 접기(collapsible)·탭·모달로 밀어 첫 화면 밀도를 유지한다.
    - area: 폼·상세 화면 밀도
      use: FHD 가로폭을 채우는 반응형 폼 그리드
      rule: >
        넓은 데스크톱 카드 안에 560~700px 고정 폭의 단일 열 입력폼만 놓고 오른쪽을 비워 두는 화면은 금지한다.
        상세/편집 화면의 폼은 1440px 이상에서 기본 2열, 정보 성격이 명확히 3개로 나뉘면 3열 카드 그리드를 사용한다. 각 열의 입력은 해당 열 폭을 100% 사용하고,
        비고·에디터·첨부·긴 설명처럼 넓이가 필요한 항목만 전체 열(span all)로 둔다. 라벨은 입력 위 또는 고정된 120~160px 열에 정렬해 입력 시작선이 맞아야 한다.
        단일 열이 반드시 필요한 긴 폼은 바깥 카드를 960~1120px max-width로 제한하고 가운데 정렬한다. 반대로 카드가 본문 폭의 70% 이상을 차지하면,
        그 카드의 실제 폼/정보 콘텐츠도 카드 내부 폭의 최소 70%를 사용하거나 남는 영역에 동등한 요약·상태·도움말 패널을 배치해야 한다.
        두 목록 간 배정/이동 UI는 양쪽 패널을 같은 폭의 1fr 그리드로 배치하고, 가운데 이동 버튼 열은 72px 이하로 제한한다. 데이터가 적어도 표/목록 패널은 남은 높이를 채우며
        내부 스크롤을 사용한다. 장식만을 위한 빈 카드, 의미 없는 우측 여백, 컨테이너의 30% 이상을 차지하는 빈 흰 영역은 결함이다.
    - area: 입출력
      use: 모달 팝업(dialog)
      rule: >
        중요 입력(설정 저장, 날짜·시간대 선택, 실행/중지/삭제/배포 같은 확인이 필요한 동작)과 상세 출력(항목 상세, 산출물·로그 본문, 오류 상세)은
        페이지 이동이나 본문 아래 인라인 확장 대신 모달 팝업으로 연다. 모달은 항상 뷰포트의 정중앙(가로·세로 모두, position: fixed; inset: 0; margin: auto)에 놓는다 — 상단 고정, 바닥 시트, 코너 팝오버로 대체하지 않으며 모바일에서도 중앙이다.
        배경 dim, 닫기 버튼, Esc 와 바깥 클릭으로 닫힘, 열릴 때 포커스 이동과 포커스 트랩, 최대 높이 90vh 안에서 본문만 내부 스크롤(헤더·액션은 고정), 폭은 내용에 따라 480/720/1080/1400px 급으로 통일한다. 브라우저 기본 alert/confirm/prompt 는 쓰지 않고 앱 모달(확인/취소 버튼, 위험 동작은 빨간 확인 버튼)로 대체한다.
        구현은 <dialog> 요소 + Tailwind 유틸리티(또는 기존 모달 패턴)로 하고 별도 모달 라이브러리는 추가하지 않는다.
  quality:
    - "경계와 여백(토큰으로 고정): 사이드바 폭 248/68px + 오른쪽 1px 경계선, 사이드바 안쪽 패딩 8px, 메뉴 항목 높이 36px·가로 패딩 12px·아이콘-라벨 간격 12px. 상단 바 높이 56px + 아래 1px 경계선, 트리거는 사이드바 경계선에서 16px, 오른쪽 여백 16px. 본문은 사이드바 경계선과 뷰포트 오른쪽에서 24px(gutter-x), 상단 바 아래·바닥 16px(gutter-y). 카드 간격 12px, 카드 패딩 16px, 카드 경계 1px + 반경 12px, 카드가 사이드바·뷰포트 가장자리에 붙으면 결함. 레일 모드에서도 같은 간격. z-index 는 상단 바 30 · 사이드바 40 · 툴팁 50 · 토스트 60, 모달은 <dialog> top layer."
    - "정렬선: 상단 바 56px = 사이드바 헤더 56px. 카드 패딩 16px, 카드 사이 간격 12px, 섹션 라벨 12~13px 뮤트 대문자/볼드, 본문 13~14px, 숫자는 tabular-nums. 간격은 4의 배수만 쓴다."
    - "뷰포트 채움: 각 화면은 1920×1080 에서 세로 스크롤 없이 꽉 차야 하며 바닥에 빈 띠(80px 이상)가 남으면 결함이다. 긴 목록·캔버스·로그가 남은 높이를 flex 로 차지하고 내부 스크롤한다. 카드 내부도 같은 원칙이다. 1440px 이상에서 카드 폭이 70% 이상인데 주 콘텐츠의 실제 경계 상자가 카드 안쪽 폭의 70% 미만이면, 카드 폭을 1120px 이하로 줄여 중앙 정렬하거나 2~3열/보조 패널로 재배치해야 한다."
    - "폼/상세 금지 패턴: 한 개의 좁은 입력 열을 화면 좌측에 붙이고 카드 오른쪽을 비우는 레이아웃, 2개 목록 중 하나만 늘리고 나머지 화면을 비우는 레이아웃, 데이터가 적다는 이유로 표 패널 높이를 본문 콘텐츠 높이로만 두는 레이아웃은 모두 FAIL이다. 긴 텍스트 입력만 전체 폭을 써야 하며, 일반 텍스트·날짜·선택 입력은 같은 행의 다른 필드와 그리드로 묶는다."
    - "위계: 요약 타일 → 비교 차트 → 목록 그리드 → 상세(모달). 같은 줄의 카드는 높이가 같고, 같은 성격의 요소는 같은 자리·같은 크기·같은 여백이다. 브랜드/제목을 두 군데에 중복 표기하지 않는다."
    - "상태 표현: 상태 색(good/warning/critical)은 범주 색과 섞지 않고 점·배지·라벨과 함께 쓴다. 빈 상태·로딩·오류 문구를 설계하고 '데이터 없음' 만 쓰지 않는다."
    - "컴포넌트: 버튼 높이 32/28px(sm), 입력 32px, 라디우스 8px(카드 10~12px), 모달 폭 480/720/1080/1400, 아이콘은 stroke 1.75 선형 SVG 18px. hover/focus-visible 상태가 모두 보인다."
    - "차트(dataviz): 범주색은 고정 순서로 배정하고 colorblind 검증(인접쌍 ΔE ≥ 8, 6~8 은 범례·간격 보조 인코딩 필수), 이중 y축 금지, 막대 끝 4px 라운드와 2px 표면 간격, 2개 이상 시리즈는 범례 필수, 텍스트는 시리즈 색이 아니라 텍스트 토큰 색."
  loading:
    - 빌드 도구(vite/webpack/next 등)가 있는 레포는 npm 의존성으로 추가하고 package.json 과 lock 파일을 함께 갱신한다.
    - 정적 HTML 레포는 위 CDN 을 정확한 버전으로 고정해 <head> 에 넣는다. latest 태그·버전 없는 URL 은 금지.
    - 같은 목적의 다른 라이브러리를 이미 쓰고 있으면 티켓 범위 안의 새 화면에만 가이드를 적용하고, 전면 교체는 별도 티켓으로 제안한다(Tech Lead).
    - 가이드 라이브러리는 CDN 로드 실패 시에도 페이지가 깨지지 않게 로드 여부를 확인하고 안내 문구를 보여 준다.
  review:
    - "QA 는 추가·수정된 프런트엔드 코드가 이 가이드를 따르는지 diff 로 확인한다. 위반(다른 그리드/차트 라이브러리나 웹폰트 추가, Tailwind 없이 새 CSS 파일 작성, 버전 미고정 CDN)은 결함으로 보고하고 'VERDICT: FAIL' 의 근거가 된다."
    - 디자인 스펙은 표에 AG Grid, 차트에 ApexCharts/Lightweight Charts 중 무엇을 쓰는지와 Tailwind 토큰 매핑을 명시해야 한다.
    - 새 화면은 반드시 공통 셸(햄버거 버튼 + 오프캔버스 좌측 사이드바) 안에 들어가야 하며, 사이드바에 메뉴 항목이 추가·갱신됐는지 확인한다. 셸 없이 독립 페이지를 만들면 결함이다.
    - "QA 는 1920×1080 뷰포트에서 주요 화면의 document.scrollHeight 가 window.innerHeight 를 넘지 않는지(브라우저 세로 스크롤 없음), 가로 스크롤이 없는지 확인한다. 페이지가 늘어나는 긴 목록·로그는 결함으로 보고한다. 폼/상세 카드에서는 카드·폼·보조 패널의 getBoundingClientRect를 측정해, 카드가 본문 폭의 70% 이상일 때 실제 콘텐츠 폭이 카드 안쪽 폭의 70% 이상인지 확인한다. 미만이면 max-width 1120px 중앙 정렬 또는 2~3열 재배치가 있는지 확인하고, 둘 다 없으면 VERDICT: FAIL로 한다."
    - "QA 는 배정/이동·비교 화면에서 좌우 목록 패널의 폭 차이가 10% 이내인지, 가운데 이동 열이 72px 이하인지, 각 목록이 남는 높이를 채우며 내부 스크롤하는지 확인한다. 카드 안에 기능 없는 빈 영역이 카드 면적의 30% 이상이면 스크린샷·px 측정값과 함께 FAIL로 보고한다."
    - "중요 입력·확인·상세 출력이 모달 팝업이 아니라 페이지 이동/인라인 확장/브라우저 alert·confirm 으로 되어 있으면 결함으로 보고한다. 모달의 Esc·바깥 클릭 닫힘과 포커스 이동을 확인한다."
    - "측정 도구: hermes-fleet 레포에는 scripts/monitor.sh qa (qa/fe_guide_check.js, Playwright) 가 있어 한 화면·여백·사이드바·모달 정중앙·테마·KST·푸터를 수치로 채점하고 qa/out/report.json 을 남긴다. QA 와 Tech Lead 는 가능한 한 이 리포트(또는 같은 방식의 Playwright 측정)를 근거로 삼고, 다른 레포에도 같은 스크립트를 복사해 MONITOR_URL 만 바꿔 쓴다."
    - "QA 체크리스트는 design.md 의 디자인 QA 체크리스트와 이 가이드의 화면 품질 기준을 항목별 PASS/FAIL 로 채점해 보고서에 표로 남긴다. 하나라도 FAIL 이면 VERDICT: FAIL 이다. Tech Lead 발굴은 같은 기준으로 감사해 위반을 측정값과 함께 P1 로 제안한다."
    - "라이트/다크 두 테마를 모두 캡처해 비교한다: 토글이 없거나, 한 테마에서 안 보이는 텍스트·경계선·차트 요소가 있거나, 리터럴 색이 컴포넌트 규칙에 있으면 결함이다. 하단 10px 검정 EDUMGT 푸터가 없거나 본문·사이드바와 겹치면 결함이다."
    - "표시된 날짜·시간이 KST 가 아니거나(브라우저 로컬·UTC 그대로 노출), API/DB 에 UTC 와 KST 가 섞여 있으면 결함으로 보고한다. QA 는 TZ=UTC 환경(또는 브라우저 시간대 변경)에서도 같은 KST 값이 보이는지 확인한다."
    - "모달이 뷰포트 정중앙이 아니거나(상단 고정·바닥 시트), 사이드바가 데스크톱 레일/펼침·모바일 시트 세 상태를 갖추지 않았거나 상단 바 왼쪽에 트리거가 없으면 결함으로 보고한다."

roles:
  pm:
    role: Product Manager
    goal: 티켓과 저장소 현황을 분석해 명확하고 검증 가능한 PRD와 작업 분해(WBS)를 작성한다.
    backstory: >
      웹 서비스(프런트엔드 + 백엔드 API)를 여러 번 출시한 시니어 PM. 기술적 실현 가능성과
      사용자 가치를 조율하며, 수용 기준(acceptance criteria)을 테스트 가능한 문장으로 쓴다.
    tools: [read_file, list_dir, search_text]
  designer:
    role: UI/UX Designer
    goal: >
      PRD를 바탕으로 FHD(1920×1080) 한 화면 기준의 레이아웃 그리드, 컴포넌트 스펙(Tailwind 토큰 매핑 포함), 상태별 UI 규칙, 접근성 요구사항을 수치로 정의하고,
      개발자가 그대로 구현할 수 있는 '디자인 QA 체크리스트'(정렬·간격·밀도·빈 공간·정중앙 모달·KST 표기)를 함께 낸다.
    backstory: >
      대시보드·운영 도구를 전문으로 하는 시니어 프로덕트 디자이너. 기존 화면의 시각 언어(색·간격·컴포넌트·CSS 변수)를 먼저 읽고 그 안에서 설계하며,
      8pt 간격 체계와 4단계 타입 스케일(11/13/16/22px), 12열 그리드, 56px 상단 바와 248/68px 사이드바 같은 구체적인 수치로 말한다.
      화면은 뷰포트를 꽉 채우되 바닥에 빈 띠가 남거나 카드 높이가 들쭉날쭉한 것을 결함으로 보고, 모든 요소의 정렬선(헤더 높이 = 사이드바 헤더 높이, 카드 패딩 16px, 라벨 12px 뮤트)을 명시한다.
      폼·상세 화면은 1440px 이상에서 2열(필요 시 3열) 배치, 단일 열 폼은 960~1120px 중앙 카드라는 선택지를 수치와 함께 명시한다. 화면의 30% 이상이 기능 없는 빈 카드 영역이면 설계 결함으로 처리한다.
      요약(타일) → 비교(차트) → 목록(그리드) → 상세(모달)의 정보 위계를 지키고, 빈 상태·로딩·오류 문구까지 설계한다. 백엔드 전용 티켓이면 운영자 관점의 로그/설정 UX만 정의한다.
    tools: [read_file, list_dir, search_text]
  developer:
    role: Senior Full-Stack Developer
    goal: PRD와 디자인 스펙에 맞춰 저장소에 실제 코드를 작성/수정하고, 테스트를 추가하며, 빌드와 테스트를 통과시킨다.
    backstory: >
      JavaScript/TypeScript 프런트엔드와 Node.js·Python(FastAPI)·Java(Spring) 백엔드를 모두 다루는 10년 차 엔지니어.
      작은 단위로 변경하고, 변경마다 저장소 프로필의 테스트 명령을 실행해 확인한다. 파일을 수정하기 전에 반드시 read_file로 현재 내용을 읽는다.
    tools: [read_file, write_file, list_dir, search_text, run_command, git_status, git_diff]
  qa:
    role: QA Automation Engineer
    goal: >
      구현이 수용 기준을 만족하는지 테스트 실행과 코드 리뷰로 검증하고, 프런트엔드 변경은 FE 가이드 체크리스트(셸·Tailwind·AG Grid/ApexCharts·FHD 한 화면·정중앙 모달·KST·빈 공간·폼 밀도·정렬)를
      항목별 PASS/FAIL 로 채점해 하나라도 FAIL 이면 'VERDICT: FAIL' 로 돌려보낸다. 결함은 파일:줄, 기대값/실제값(px·색·시각)으로 재현 가능하게 적는다.
    backstory: >
      TDD와 엄격한 품질 기준을 가진 테스트 엔지니어. 직접 테스트/빌드를 실행하고 diff를 읽으며,
      보고서 마지막 줄에 반드시 'VERDICT: PASS' 또는 'VERDICT: FAIL'을 명시한다.
    tools: [read_file, list_dir, search_text, run_command, git_status, git_diff]
  techlead:
    role: Tech Lead
    goal: >
      저장소를 분석해 다음에 처리할 가치가 높은 개선 티켓을 작은 단위로 제안한다. 프런트엔드가 있는 레포는 먼저 FE 가이드 준수 감사를 하고
      위반(상단 탭 내비게이션, 사이드바 세 상태 미구현, 브라우저 세로 스크롤, 바닥 빈 공간, 넓은 카드 안의 좁은 단일 열 폼·의미 없는 우측 빈 영역, 비정중앙 모달, confirm/alert, 브라우저 로컬 시간대 표기, 비고정 CDN, 다른 그리드/차트 라이브러리)을
      파일:줄 근거와 측정값(예: document.scrollHeight 1546 > 1080)으로 정확히 지적해 P1 티켓으로 올린다. 제안은 사람이 승인한다.
    backstory: >
      여러 서비스의 코드베이스를 정기적으로 점검하는 테크 리드. 추측보다 코드 근거를 중시하고,
      하루 안에 끝낼 수 있는 범위로 작업을 쪼개며, 이미 있는 티켓과 중복되는 제안은 하지 않는다.
    tools: [read_file, list_dir, search_text, git_status]
    # OpenRouter-compatible default.  A role-specific model must be available
    # from the same endpoint as HERMES_MODEL.
    model: openai/gpt-4.1-mini

stages:
  pm: {role: pm, output: prd.md}
  design: {role: designer, output: design.md}
  dev: {role: developer, output: dev-report.md}
  qa: {role: qa, output: qa-report.md}

review_loop:
  pass_token: "VERDICT: PASS"
  fail_token: "VERDICT: FAIL"
  artifact_excerpt_chars: 6000

discover:
  role: techlead
