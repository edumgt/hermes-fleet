# Hermes Fleet 웹 모니터
#   scripts/monitor.sh up      # 빌드 + 기동 → http://localhost:8787
#   scripts/monitor.sh down
#
# 호스트의 root(hermes-fleet 의 상위 폴더)를 컨테이너 안 같은 경로에 읽기 전용으로 마운트한다.
# fleet.yaml 의 root, state/, logs/, 각 레포의 hermes/backlog·workspace·.git 을 그대로 읽기 위해 경로를 바꾸지 않는다.
# hermes-fleet 디렉터리만 쓰기 가능으로 겹쳐 마운트한다 — 웹에서 레포 선택/해제가 fleet.yaml 의 include/exclude 를 고치기 위해서다.
# 이 폴더에서 `docker compose up -d` 만 실행해도 된다: FLEET_DIR 기본값은 현재 폴더($PWD), FLEET_ROOT 기본값은 그 상위 폴더($PWD/..).
# 주의: ${PWD} 는 compose 를 실행한 셸의 현재 폴더다. 다른 폴더에서 `docker compose -f .../docker-compose.yml up` 하면 경로가 어긋나므로
#       그때는 FLEET_DIR=/path/to/hermes-fleet 을 함께 넘기거나 scripts/monitor.sh up 을 쓴다 (엔트리포인트가 하위 폴더에서 hermes-fleet 을 찾아 보정은 한다).
# fleet.yaml 이 없으면(받은 직후) 모니터 컨테이너가 상위 폴더를 읽어 자동 init(fleet.yaml/.env 생성) 한다. 이미 있으면 그대로 쓴다.
# 기동할 때마다 Jev 가 다른 레포의 변경을 보고 프로젝트로 진행할지 판정해 include/exclude 를 갱신한다(review 블록, HERMES_REVIEW=skip 으로 끔).
services:
  monitor:
    build:
      context: .
      dockerfile: docker/monitor.Dockerfile
    image: hermes-fleet-monitor:local
    container_name: hermes-fleet-monitor
    restart: unless-stopped
    ports:
      - "${MONITOR_BIND:-127.0.0.1}:${MONITOR_PORT:-8787}:8787"
    volumes:
      - "${FLEET_ROOT:-${PWD}/..}:${FLEET_ROOT:-${PWD}/..}:ro"
      - "${FLEET_DIR:-${PWD}}:${FLEET_DIR:-${PWD}}:rw"
    environment:
      HERMES_FLEET_DIR: "${FLEET_DIR:-${PWD}}"
      # 자동 init: auto(기본) | skip. HERMES_INIT_ARGS 로 --provider/--base-url/--model/--include 등을 넘길 수 있다 (예: "--provider openai --base-url http://host.docker.internal:1234/v1")
      HERMES_INIT: "${HERMES_INIT:-auto}"
      HERMES_INIT_ARGS: "${HERMES_INIT_ARGS:-}"
      TZ: "${TZ:-Asia/Seoul}"
      # Windows 호스트의 Ollama. Docker Desktop 은 host.docker.internal 을 제공한다. 다른 곳이면 HERMES_BASE_URL 로 지정.
      OLLAMA_HOST: "${MONITOR_OLLAMA_HOST:-host.docker.internal:11434}"
      HERMES_BASE_URL: "${MONITOR_HERMES_BASE_URL:-}"
      # GitHub Actions 실행 상태 조회용(비공개 레포면 필요). repo 읽기 권한의 fine-grained 토큰이면 충분.
      MONITOR_GITHUB_TOKEN: "${MONITOR_GITHUB_TOKEN:-}"
      # Jev(TypeSafe AI 판단 전용 모델) — 컨테이너 (재)기동 때 레포별 '프로젝트로 진행할지' 판정 → fleet.yaml include/exclude 갱신.
      # 키는 보통 hermes-fleet/.env 의 TYPESAFE_API_KEY 또는 OPENROUTER_API_KEY 에 둔다(마운트돼 컨테이너가 읽음). 여기 값이 비면 .env 가 쓰인다.
      # HERMES_REVIEW=skip 으로 끔(fleet.yaml review.on_start 로도 끔). OpenRouter: JEV_PROVIDER=openrouter, JEV_MODEL=typesafe/jev-1.14.
      HERMES_REVIEW: "${HERMES_REVIEW:-auto}"
      TYPESAFE_API_KEY: "${TYPESAFE_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      TYPESAFE_BASE_URL: "${TYPESAFE_BASE_URL:-}"
      JEV_PROVIDER: "${JEV_PROVIDER:-}"
      JEV_MODEL: "${JEV_MODEL:-}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  # FE 가이드 준수 측정 러너 (profile qa): scripts/monitor.sh qa → 모니터를 실제 Chromium 으로 열어 1920×1080/1366×768 에서
  # 한 화면·여백·사이드바·모달 정중앙·테마·KST·푸터를 수치로 채점하고 qa/out/ 에 report.json + 스크린샷을 남긴다. 위반이 있으면 종료 코드 1.
  playwright:
    build:
      context: .
      dockerfile: docker/playwright.Dockerfile
    image: hermes-fleet-playwright:local
    profiles: ["qa"]
    ipc: host
    environment:
      MONITOR_URL: "${QA_MONITOR_URL:-http://monitor:8787}"
      QA_OUT: /qa/out
      QA_STRICT_WIDTHS: "${QA_STRICT_WIDTHS:-1920}"
      TZ: Asia/Seoul
    volumes:
      - "./qa:/qa:ro"
      - "./qa/out:/qa/out:rw"
    depends_on:
      monitor:
        condition: service_healthy
