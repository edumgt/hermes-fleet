# Hermes Fleet 웹 모니터
#   scripts/monitor.sh up      # 빌드 + 기동 → http://localhost:8787
#   scripts/monitor.sh down
#
# 호스트의 root(/home/ubuntu)를 컨테이너 안 같은 경로에 읽기 전용으로 마운트한다.
# fleet.yaml 의 root, state/, logs/, 각 레포의 hermes/backlog·workspace·.git 을 그대로 읽기 위해 경로를 바꾸지 않는다.
# hermes-fleet 디렉터리만 쓰기 가능으로 겹쳐 마운트한다 — 웹에서 레포 선택/해제가 fleet.yaml 의 include/exclude 를 고치기 위해서다.
# 다른 위치에 설치했다면 .env 또는 셸에서 FLEET_ROOT / FLEET_DIR 를 지정한다.
services:
  monitor:
    build:
      context: .
      dockerfile: docker/monitor.Dockerfile
    image: hermes-fleet-monitor:local
    container_name: hermes-fleet-monitor
    restart: unless-stopped
    ports:
      - "${MONITOR_BIND:-127.0.0.1}:${MONITOR_PORT:-8787}:8787"
    volumes:
      - "${FLEET_ROOT:-/home/ubuntu}:${FLEET_ROOT:-/home/ubuntu}:ro"
      - "${FLEET_DIR:-/home/ubuntu/hermes-fleet}:${FLEET_DIR:-/home/ubuntu/hermes-fleet}:rw"
    environment:
      HERMES_FLEET_DIR: "${FLEET_DIR:-/home/ubuntu/hermes-fleet}"
      TZ: "${TZ:-Asia/Seoul}"
      # Windows 호스트의 Ollama. Docker Desktop 은 host.docker.internal 을 제공한다. 다른 곳이면 HERMES_BASE_URL 로 지정.
      OLLAMA_HOST: "${MONITOR_OLLAMA_HOST:-host.docker.internal:11434}"
      HERMES_BASE_URL: "${MONITOR_HERMES_BASE_URL:-}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
